name: Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump Supabase database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create compressed database dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL is not configured in GitHub Actions secrets."
            exit 1
          fi
          mkdir -p backup
          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="backup/quiz-space-${GITHUB_RUN_ID}.dump"
          sha256sum "backup/quiz-space-${GITHUB_RUN_ID}.dump" > "backup/quiz-space-${GITHUB_RUN_ID}.sha256"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiz-space-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
